name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish
        run: dotnet publish src/mTiles/mTiles.csproj -c Release --self-contained -r win-x64 -o ./publish

      # Dictation and the terminal both depend on native binaries that arrive through NuGet's own copy
      # rules. Losing one leaves a build that starts and then fails under the user's finger.
      - name: Verify native binaries and notices
        shell: pwsh
        run: ./.github/workflows/verify-natives.ps1 -PublishDir ./publish -Rid win-x64

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Create Velopack package
        run: vpk pack --packId mTiles --packVersion ${{ env.VERSION }} --packDir ./publish --mainExe mTiles.exe --icon src/mTiles/mtiles.ico

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            Releases/mTiles-win-Setup.exe
            Releases/mTiles-win-Portable.zip
            Releases/mTiles-*-full.nupkg
            Releases/releases.win.json
            Releases/assets.win.json
            Releases/RELEASES

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      # The only place the suite runs on Linux, and the reason it runs at all: 0.4.43 shipped an
      # application that could not start there, because the fault was in a branch a Windows machine
      # never takes and nothing on this workflow had ever executed a test against Linux.
      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/mTiles/mTiles.csproj -c Release --self-contained -r linux-x64 -o ./publish

      - name: Verify native binaries and notices
        shell: pwsh
        run: ./.github/workflows/verify-natives.ps1 -PublishDir ./publish -Rid linux-x64

      - name: Create AppImage structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy published files
          cp -r ./publish/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/mTiles

          # Copy desktop file and icon
          cp deploy/linux/mTiles.desktop AppDir/
          cp deploy/linux/AppRun AppDir/
          chmod +x AppDir/AppRun

          # Copy icon for AppImage
          cp src/mTiles/Assets/mtiles-icon.png AppDir/mtiles.png
          cp src/mTiles/Assets/mtiles-icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/mtiles.png

      - name: Verify the AppImage tree
        shell: pwsh
        run: |
          # Again, on what is actually packaged. The step above checked ./publish; this checks what came
          # out of the copy, which is a different question — a cp that drops a runtimes/ subtree, or a
          # future step that prunes the directory to save space, would otherwise ship an AppImage whose
          # dictation cannot start and whose terminal falls back to the in-box console host.
          ./.github/workflows/verify-natives.ps1 -PublishDir ./AppDir/usr/bin -Rid linux-x64

      - name: Download appimagetool
        run: |
          # appimagetool has no stable versioned releases — "continuous" is their rolling stable.
          # To harden: replace the URL with a specific commit-sha download if supply chain is a concern.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir mTiles-linux-x86_64.AppImage

      # What the Arch package is built from. Deliberately the publish tree rather than the
      # AppImage: extracting an AppImage inside a PKGBUILD means unpacking somebody else's
      # squashfs to get at files we already have here, and the AppImage carries its own FUSE
      # runtime that a distribution package must not ship.
      #
      # The .desktop, the icon and the licence travel in the tarball beside the binaries so that
      # the PKGBUILD has exactly one source. A package that reached into the git repository for
      # its desktop entry could not be built from a release alone — which is what AUR will
      # require of it later.
      - name: Create the Linux tarball
        run: |
          TREE="mTiles-${VERSION}-linux-x64"
          mkdir -p "$TREE/bin"
          cp -r ./publish/. "$TREE/bin/"
          cp deploy/linux/mTiles.desktop "$TREE/mTiles.desktop"
          cp src/mTiles/Assets/mtiles-icon-256.png "$TREE/mtiles.png"
          cp LICENSE "$TREE/LICENSE"
          tar czf mTiles-linux-x64.tar.gz "$TREE"
          sha256sum mTiles-linux-x64.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            mTiles-linux-x86_64.AppImage
            mTiles-linux-x64.tar.gz

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: mTiles ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/windows-release/mTiles-win-Setup.exe
            artifacts/windows-release/mTiles-win-Portable.zip
            artifacts/windows-release/mTiles-*-full.nupkg
            artifacts/windows-release/releases.win.json
            artifacts/windows-release/assets.win.json
            artifacts/windows-release/RELEASES
            artifacts/linux-release/mTiles-linux-x86_64.AppImage
            artifacts/linux-release/mTiles-linux-x64.tar.gz

  arch-repo:
    needs: [create-release]
    uses: ./.github/workflows/arch-repo.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
