name: Tests

# Runs the suite on both platforms on every push, which release.yml cannot do: it fires on a tag,
# so until now the only way to learn that something was broken on Linux was to cut a release and
# watch it fail. 0.4.43 shipped an application that could not start there for exactly that reason.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # No filter and no exclusions: what this runs is the whole suite, on both platforms, and the
      # point is that the two agree. Eight tests used to be excluded on Linux for encoding Windows
      # behaviour — DPAPI, a locked file, a hook without its executable bit — and each now asserts
      # what is true on the platform it is running on.
      - name: Test
        run: dotnet test -c Release --logger "trx;LogFileName=r.trx" --results-directory TestResults

      # Fails on a test slower than the budget that does not say why it may be (README, rule 1). After
      # the suite, and on its result file, so a red test and a slow one are two different messages.
      # A test over the budget is run once more on its own and fails only if it is slow again: a hosted
      # runner can be several times slower for minutes at a time (see the script).
      # Pinned rather than assumed: the Windows runner has no `python3`, only `python`.
      - uses: actions/setup-python@v5
        if: success() || failure()
        with:
          python-version: '3.x'

      - name: Test time budget
        if: success() || failure()
        shell: bash
        run: |
          # The TRX file carries no traits, so the Slow ones are named by a run filtered to them.
          dotnet test -c Release --no-build --filter "Category=Slow" --logger "trx;LogFileName=slow.trx" --results-directory TestResults || true
          python scripts/test-budget.py TestResults/r.trx --slow TestResults/slow.trx --rerun
